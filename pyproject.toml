[project]
name = "ner-rnapii-3d"
version = "0.1.0"
description = "1D loop-extrusion + RNAPII + lesion simulation engine (writes LEFPositions.h5)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.1",
    "numba>=0.60",
    "h5py>=3.10",
    "pyyaml>=6.0",
    "matplotlib>=3.11.0",
    "pandas>=2.3.3",
]

[project.scripts]
ner-sim = "ner_rnapii_3d.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ner_rnapii_3d"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
