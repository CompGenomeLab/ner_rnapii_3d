lef:
  bp_per_site: 250   # bp represented by one lattice site (== one 3D monomer)
  chain_length: 40000
  num_chains: 20
  separation: 960
  lifetime: 338
  lifetime_stalled: 338
  lifetime_ctcf: 1352 # Cohesin lifetime when its captured by a CTCF site (boosted from the base lifetime)
  tick_seconds: 4
  warmup_steps: 40000
  trajectory_length: 160000
  chunk_size: 50
  seed: 42
  max_rnapii: 27861

  topology_kwargs:
    tads:
      - {left: 0, right: 7461, left_strength: 0.15, right_strength: 0.09}
      - {left: 7462, right: 12245, left_strength: 0.09, right_strength: 0.09}
      - {left: 12246, right: 16708, left_strength: 0.09, right_strength: 0.09}
      - {left: 16709, right: 21291, left_strength: 0.09, right_strength: 0.14}
      - {left: 21292, right: 24690, left_strength: 0.14, right_strength: 0.15}
      - {left: 24691, right: 26728, left_strength: 0.15, right_strength: 0.15}
      - {left: 26729, right: 28925, left_strength: 0.15, right_strength: 0.13}
      - {left: 28926, right: 33699, left_strength: 0.13, right_strength: 0.10}
      - {left: 33700, right: 37805, left_strength: 0.10, right_strength: 0.12}
      - {left: 37806, right: 39999, left_strength: 0.12, right_strength: 0.15}
    default_boundary_strength: 0.15
    release_prob: 0.0
    include_chromosome_ends: true
    # RNAP is a permeable moving barrier (Banigan), NOT a fast cohesin-eviction state: keep RNAP-stalled
    # cohesin at the base lifetime (a short eviction lifetime would DEPLETE cohesin at genes, verified 1D).
    lifetime_rnapii_stalled: 338
    rnapii_stride: 2
    # Decelerated step prob for a Pol crawling the 3' termination window (Cortazar 2019 ~0.7-0.9 kb/min);
    # vacates the TES quickly so the 3' end stops capping output at 1/dwell.
    rnapii_termination_step_prob: 0.272
    # Banigan moving barrier (per-encounter probs, tick-independent): an elongating RNAP wins head-on and
    # pushes the converging cohesin leg; co-directional (trailing) contact only impedes it.
    rnapii_stall_prob: 0.0
    rnapii_push_prob: 0.0
    rnapii_headon_push_prob: 1.0
    rnapii_pause_cohesin_restraint: 1.0
    rnapii_pause_restraint_window: 1
    # Promoter-proximal premature termination competing with productive release (pause_release_prob);
    # productive fraction ~0.1-0.25 (activity-dependent).
    rnapii_pause_term_prob: 0.0952
    # Per-tick cohesin bypass of a Pol II barrier (tbypass ~100 s, Banigan); pre-initiation Pol is a
    # LEAKY barrier (~8x faster bypass), paused/elongating/terminating are strong.
    rnapii_pre_initiation_block_prob: 0.717
    rnapii_paused_block_prob: 0.961
    rnapii_elongating_block_prob: 0.961
    rnapii_terminating_block_prob: 0.961
    # Pause-initiation limit: a paused Pol in the promoter-proximal window suppresses new
    # initiation (Gressel 2019; Bartman 2019). Output is then gated by pause-escape, ~realistic.
    rnapii_promoter_occlusion: true
    ep_contact_tolerance: 1
    replicate_genes_across_chains: true
    targeted_load_prob: 0.0
    loading_window: 1
    target_enhancers: false
    target_tss: false
    weight_loading_by_activity: false
    lesion_spacing: 0            # lesions off (config1/2/3)
    genes:
